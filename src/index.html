<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product Card</title>
    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
  </head>

  <body>
    <main class="page">
      <div
        class="card"
        data-qa="card"
      >
        <img
          class="card__image"
          src="./images/imac.jpeg"
          alt="Apple iMac 27"
        />

        <h2 class="card__title">
          APPLE A1419 iMac 27&quot; Retina 5K Monoblock (MNED2UA/A)
        </h2>

        <p class="card__code">
          Product code: 195434
        </p>

        <div class="card__rating">
          <div class="stars stars--4">
            <span class="stars__star"></span>
            <span class="stars__star"></span>
            <span class="stars__star"></span>
            <span class="stars__star"></span>
            <span class="stars__star"></span>
          </div>

          <span class="card__reviews">
            Reviews: 5
          </span>
        </div>

        <div class="card__price">
          <span class="card__price-label">
            Price:
          </span>

          <span class="card__price-value">
            $2,199
          </span>
        </div>

        <a
          class="card__buy"
          href="#"
          data-qa="hover"
        >
          Buy
        </a>
      </div>
    </main>
  </body>
</html>
